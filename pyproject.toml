[project]
name = "openflow-engine"
version = "0.1.0"
description = "A safe, testable DAG execution engine for OpenFlow"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "uvicorn>=0.28.0",
]
spark = [
    "pyspark>=3.5.0",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]
ui = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]
all = [
    "openflow-engine[api,spark,test,ui]",
]

[project.scripts]
openflow-ui = "openflow_ui.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

